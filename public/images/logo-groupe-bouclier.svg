<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Parchment background radial gradient -->
    <radialGradient id="parchmentBg" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#f5e8be" />
      <stop offset="55%" stop-color="#d9ba79" />
      <stop offset="85%" stop-color="#b88f4b" />
      <stop offset="100%" stop-color="#6d481b" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a0" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#996515" />
      <stop offset="100%" stop-color="#54360a" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8cc" />
      <stop offset="50%" stop-color="#e6c453" />
      <stop offset="100%" stop-color="#875b17" />
    </linearGradient>

    <!-- Ribbon Deep Navy Gradient -->
    <linearGradient id="ribbonDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1526" />
      <stop offset="50%" stop-color="#192d4f" />
      <stop offset="100%" stop-color="#0a1526" />
    </linearGradient>

    <!-- Torch Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d90429" />
      <stop offset="45%" stop-color="#f77f00" />
      <stop offset="100%" stop-color="#ffea00" />
    </linearGradient>

    <filter id="parchmentShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .ribbon-text {
      font-family: 'Cinzel', 'Trajan Pro', 'Times New Roman', Georgia, serif;
      font-weight: 900;
      letter-spacing: 3.5px;
      text-anchor: middle;
      fill: url(#goldLight);
    }
    .motto-text {
      font-family: 'Cinzel', 'Trajan Pro', 'Times New Roman', Georgia, serif;
      font-weight: 800;
      letter-spacing: 2px;
      text-anchor: middle;
      fill: #2b1a03;
    }
  </style>

  <!-- Outer Parchment with aged deckled borders -->
  <path
    d="M 45,35 Q 150,25 250,32 Q 350,22 455,38 Q 470,145 460,250 Q 472,365 455,462 Q 350,475 250,465 Q 140,478 45,462 Q 28,355 38,250 Q 25,135 45,35 Z"
    fill="url(#parchmentBg)"
    stroke="#422505"
    stroke-width="3"
    filter="url(#parchmentShadow)"
  />

  <!-- Subtle Parchment Texture & Creases -->
  <path
    d="M 55,65 Q 250,80 445,72 M 65,435 Q 250,420 435,428 M 50,195 Q 180,230 250,210 Q 340,190 450,205"
    stroke="#52350d"
    stroke-width="1"
    opacity="0.25"
    fill="none"
  />

  <!-- Top Ribbon Banner : GROUPE BOUCLIER -->
  <g id="topRibbon" transform="translate(0, 10)">
    <!-- Banner Ribbons Tails -->
    <path d="M 85,85 Q 65,58 90,42 L 138,54 L 122,96 Z" fill="#15243d" stroke="url(#goldGrad)" stroke-width="2.2" />
    <path d="M 415,85 Q 435,58 410,42 L 362,54 L 378,96 Z" fill="#15243d" stroke="url(#goldGrad)" stroke-width="2.2" />

    <!-- Main Arched Ribbon -->
    <path
      d="M 108,78 Q 250,40 392,78 Q 382,108 365,110 Q 250,72 135,110 Z"
      fill="url(#ribbonDark)"
      stroke="url(#goldGrad)"
      stroke-width="3.5"
    />

    <!-- Ribbon Text: GROUPE BOUCLIER -->
    <path id="textPathTop" d="M 115,92 Q 250,56 385,92" fill="none" />
    <text class="ribbon-text" font-size="21">
      <textPath href="#textPathTop" startOffset="50%">
        GROUPE BOUCLIER
      </textPath>
    </text>
  </g>

  <!-- Radiant Gold Star above Crest -->
  <g transform="translate(250, 122)">
    <polygon
      points="0,-20 6,-6 20,0 6,6 0,20 -6,6 -20,0 -6,-6"
      fill="url(#goldGrad)"
      stroke="#54360a"
      stroke-width="1.2"
    />
    <circle cx="0" cy="0" r="3" fill="#fff9db" />
  </g>

  <!-- Crest: Golden Heraldic Hound holding blazing torch -->
  <g transform="translate(250, 144) scale(0.92)">
    <!-- Torch & Flame -->
    <rect x="-44" y="-30" width="7" height="35" rx="2" fill="url(#goldGrad)" transform="rotate(-20 -40 -15)" stroke="#3d2506" stroke-width="1.2" />
    <path
      d="M -52,-48 C -60,-35 -42,-25 -47,-15 C -36,-20 -39,-36 -44,-42 C -42,-40 -48,-48 -52,-48 Z"
      fill="url(#flameGrad)"
      stroke="#b43b00"
      stroke-width="1.2"
    />

    <!-- Hound Body -->
    <path
      d="M -30,-6 Q -25,-18 -10,-18 Q 15,-18 30,-6 Q 38,10 32,20 L 25,20 L 25,5 Q 10,12 -5,5 L -8,20 L -15,20 L -14,2 Q -22,-3 -28,8 L -34,6 Z"
      fill="url(#goldGrad)"
      stroke="#3d2506"
      stroke-width="1.5"
    />
    <!-- Hound Head -->
    <path
      d="M -26,-15 L -36,-20 L -39,-15 L -32,-9 L -25,-8 Z"
      fill="url(#goldGrad)"
      stroke="#3d2506"
      stroke-width="1.5"
    />
    <!-- Tail -->
    <path
      d="M 30,-6 Q 46,-14 51,-3 Q 53,10 38,12 Q 33,5 30,-6 Z"
      fill="url(#goldGrad)"
      stroke="#3d2506"
      stroke-width="1.5"
    />
    <!-- Wreath / Torse -->
    <rect x="-42" y="20" width="84" height="8" rx="3" fill="url(#goldLight)" stroke="#3d2506" stroke-width="1.5" />
  </g>

  <!-- Knight Helmet -->
  <g transform="translate(250, 186)">
    <path
      d="M -24,-10 C -24,-24 24,-24 24,-10 C 24,6 15,20 0,24 C -15,20 -24,6 -24,-10 Z"
      fill="url(#goldGrad)"
      stroke="#3d2506"
      stroke-width="2.2"
    />
    <path d="M -13,-3 L 13,-3 L 9,6 L -9,6 Z" fill="#0d1b2a" stroke="#3d2506" stroke-width="1" />
  </g>

  <!-- Baroque Mantling (Golden Scroll Foliage) -->
  <g stroke="#3d2506" stroke-width="2.2" fill="url(#goldGrad)">
    <!-- Left Mantling -->
    <path d="M 180,180 C 125,158 105,218 132,260 C 100,250 85,290 122,330 C 92,342 108,382 148,382 C 128,352 148,332 165,336 C 142,290 168,260 174,228 Z" />
    <!-- Right Mantling -->
    <path d="M 320,180 C 375,158 395,218 368,260 C 400,250 415,290 378,330 C 408,342 392,382 352,382 C 372,352 352,332 335,336 C 358,290 332,260 326,228 Z" />
  </g>

  <!-- Heraldic Shield -->
  <g transform="translate(250, 305)" filter="url(#shieldShadow)">
    <!-- Shield Outer Gold Rim -->
    <path
      d="M -88,-102 L 88,-102 C 88,-10 78,56 0,98 C -78,56 -88,-10 -88,-102 Z"
      fill="url(#goldGrad)"
      stroke="#221302"
      stroke-width="4.5"
    />

    <!-- Shield Inner Quartered Field -->
    <clipPath id="shieldInnerClip">
      <path d="M -80,-94 L 80,-94 C 80,-8 70,50 0,88 C -70,50 -80,-8 -80,-94 Z" />
    </clipPath>

    <g clipPath="url(#shieldInnerClip)">
      <!-- Top-Left: Black Sable -->
      <rect x="-85" y="-105" width="85" height="105" fill="#111111" />
      <!-- Top-Right: White Argent -->
      <rect x="0" y="-105" width="85" height="105" fill="#f8f9fa" />
      <!-- Bottom-Left: White Argent -->
      <rect x="-85" y="0" width="85" height="105" fill="#f8f9fa" />
      <!-- Bottom-Right: Black Sable -->
      <rect x="0" y="0" width="85" height="105" fill="#111111" />

      <!-- Central Dominican Cross Fleury (White, Black & Gold) -->
      <g transform="scale(1.08)">
        <!-- Cross Outline Gold -->
        <path
          d="M -8,-56 L 8,-56 L 8,-16 L 44,-16 L 44,-8 L 56,-8 L 56,8 L 44,8 L 44,16 L 8,16 L 8,52 L -8,52 L -8,16 L -44,16 L -44,8 L -56,8 L -56,-8 L -44,-8 L -44,-16 L -8,-16 Z"
          fill="none"
          stroke="#d4af37"
          stroke-width="4.5"
        />
        <!-- Cross Body White -->
        <path
          d="M -7,-54 L 7,-54 L 7,-15 L 42,-15 L 42,-7 L 54,-7 L 54,7 L 42,7 L 42,15 L 7,15 L 7,50 L -7,50 L -7,15 L -42,15 L -42,7 L -54,7 L -54,-7 L -42,-7 L -42,-15 L -7,-15 Z"
          fill="#ffffff"
          stroke="#261703"
          stroke-width="2"
        />
        <!-- Golden Fleur-de-lis Tips -->
        <circle cx="0" cy="-56" r="4.5" fill="url(#goldLight)" stroke="#3d2506" stroke-width="0.8" />
        <circle cx="0" cy="52" r="4.5" fill="url(#goldLight)" stroke="#3d2506" stroke-width="0.8" />
        <circle cx="-56" cy="0" r="4.5" fill="url(#goldLight)" stroke="#3d2506" stroke-width="0.8" />
        <circle cx="56" cy="0" r="4.5" fill="url(#goldLight)" stroke="#3d2506" stroke-width="0.8" />
      </g>
    </g>
  </g>

  <!-- Bottom Motto Banner: LAUDARE, BENEDICERE, PRAEDICARE -->
  <g transform="translate(0, 420)">
    <!-- Banner Ribbons Tails -->
    <path d="M 115,-6 L 82,-26 L 136,-21 Z" fill="#996515" stroke="#3d2506" stroke-width="1.8" />
    <path d="M 385,-6 L 418,-26 L 364,-21 Z" fill="#996515" stroke="#3d2506" stroke-width="1.8" />

    <!-- Main Arched Bottom Ribbon -->
    <path
      d="M 112,-12 Q 250,32 388,-12 Q 378,20 356,22 Q 250,58 144,22 Z"
      fill="url(#goldGrad)"
      stroke="#3d2506"
      stroke-width="3"
      filter="url(#parchmentShadow)"
    />

    <!-- Motto Text on Curved Path -->
    <path id="textPathBottom" d="M 122,6 Q 250,44 378,6" fill="none" />
    <text class="motto-text" font-size="13">
      <textPath href="#textPathBottom" startOffset="50%">
        LAUDARE, BENEDICERE, PRAEDICARE
      </textPath>
    </text>
  </g>
</svg>
